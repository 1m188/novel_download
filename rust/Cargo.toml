[package]
name = "novel_download"
version = "0.1.0"
edition = "2021"

[dependencies]
reqwest = { version = "0.12", features = ["gzip", "brotli"] }
scraper = "0.22"
encoding_rs = "0.8"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
anyhow = "1"

[dev-dependencies]
wiremock = "0.6"
